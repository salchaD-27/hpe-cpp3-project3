# node-5-orch/docker-compose.yml
version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: node-5-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8005:9429"
    restart: unless-stopped

  # FIXED: Use victoria-logs image with select mode as backup
  vlselect-backup:
    image: victoriametrics/victoria-logs:v1.49.0
    container_name: node-5-vlselect
    command:
      - "-storageNode=host.docker.internal:8002"
      - "-storageNode=host.docker.internal:8003"
      - "-httpListenAddr=:9429"
      - "-insert.disable=true"
    ports:
      - "8006:9429"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped