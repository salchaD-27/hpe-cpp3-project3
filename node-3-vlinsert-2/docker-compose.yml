services:
  vlinsert:
    image: victoriametrics/victoria-logs:v1.49.0
    container_name: node-3-vlinsert-2
    command:
      # Only writes to vlstorage-2
      - "-storageNode=node-6-vlstorage-2:9428"
      - "-httpListenAddr=:9428"
      - "-select.disable=true"
    ports:
      - "8012:9428"
    restart: unless-stopped
    networks:
      - multi-node-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  multi-node-net:
    external: true