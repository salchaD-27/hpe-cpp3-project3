services:
  vlagent:
    image: victoriametrics/vlagent:v1.50.0
    container_name: node-10-vlagent
    command:
      - "-httpListenAddr=:9429"
      
      # Three destinations in a single flag (comma-separated)
      - "-remoteWrite.url=http://node-9-vmauth:8427/insert/jsonline?_stream_fields=log_source&_msg_field=_msg&_time_field=@timestamp,http://node-9-vmauth:8427/insert/jsonline?_stream_fields=log_source&_msg_field=_msg&_time_field=@timestamp,http://node-9-vmauth:8427/insert/jsonline?_stream_fields=log_source&_msg_field=_msg&_time_field=@timestamp"
      
      # Corresponding credentials (positional)
      - "-remoteWrite.basicAuth.username=write1,write2,write3"
      - "-remoteWrite.basicAuth.password=hpc-write-pass-1,hpc-write-pass-2,hpc-write-pass-3"
      
      # Format for each destination
      - "-remoteWrite.format=jsonline,jsonline,jsonline"
      
      - "-tmpDataPath=/vlagent-data"
      - "-remoteWrite.tmpDataPath=/vlagent-data/remotewrite"
      - "-remoteWrite.maxDiskUsagePerURL=10GB"
      - "-remoteWrite.queues=4"
      - "-remoteWrite.flushInterval=5s"
      - "-remoteWrite.retryMinInterval=1s"
      - "-remoteWrite.retryMaxTime=1m"
      - "-loggerLevel=INFO"
      - "-loggerFormat=json"
      - "-remoteWrite.showURL=true"
    volumes:
      - ./vlagent-data:/vlagent-data
    ports:
      - "9429:9429"
    restart: unless-stopped
    networks:
      - multi-node-net

networks:
  multi-node-net:
    external: true
