services:
  vlselect:
    image: victoriametrics/victoria-logs:v1.49.0
    container_name: node-5-vlselect
    command:
      - "-storageNode=node-3-vlstorage:9428"
      - "-storageNode=node-4-vlstorage:9428"
      - "-httpListenAddr=:9428"
      - "-insert.disable=true"
    ports:
      - "8004:9428"
    restart: unless-stopped
    networks:
      - multi-node-net

networks:
  multi-node-net:
    external: true