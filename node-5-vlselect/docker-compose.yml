# =============================================================================
# Node 5 — vlselect (Query Node)
# Handles all read/query traffic from Grafana and vmalert.
# Fans out queries to Node 3 & 4 (vlstorage) and merges results.
# -insert.disable=true  → this node never accepts write traffic.
# =============================================================================

services:
  vlselect:
    image: victoriametrics/victoria-logs:v1.49.0
    container_name: node-5-vlselect
    command:
      - "-storageNode=node-3-vlstorage:9428"
      - "-storageNode=node-4-vlstorage:9428"
      - "-httpListenAddr=:9428"
      - "-insert.disable=true"
    ports:
      - "8004:9428"
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: multi-node-net
    external: true
