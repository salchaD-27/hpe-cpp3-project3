# =============================================================================
# Fluent Bit Configuration — Node 1
# Tails JSONL files from the simulator and forwards to Kafka on the same node.
# =============================================================================

[SERVICE]
    Flush            1
    Daemon           Off
    Log_Level        info
    # Path must match the volume mount in docker-compose (absolute path)
    Parsers_File     /fluent-bit/etc/parsers.conf
    HTTP_Server      On
    HTTP_Listen      0.0.0.0
    HTTP_Port        2020

# -----------------------------------------------------------------------------
# INPUT — tail all three JSONL files written by the simulator
# -----------------------------------------------------------------------------
[INPUT]
    Name             tail
    Path             /generated-logs/*.jsonl
    Path_Key         source_file
    Tag              hpc.logs
    # Must match the [PARSER] Name in parsers.conf
    Parser           json_parser
    Refresh_Interval 1
    Mem_Buf_Limit    100MB
    Skip_Long_Lines  On
    Read_from_Head   On

# -----------------------------------------------------------------------------
# OUTPUT — Kafka (main pipeline)
# Brokers: internal listener on node-1-kafka, same Docker network
# -----------------------------------------------------------------------------
[OUTPUT]
    Name                                  kafka
    Match                                 hpc.logs
    Brokers                               node-1-kafka:9092
    Topics                                hpc-logs
    Format                                json
    Timestamp_Key                         @timestamp
    Timestamp_Format                      iso8601
    rdkafka.request.required.acks         1
    rdkafka.log.connection.close          false
    rdkafka.compression.codec             lz4
    rdkafka.batch.num.messages            1000
    rdkafka.queue.buffering.max.messages  100000
    rdkafka.linger.ms                     20
