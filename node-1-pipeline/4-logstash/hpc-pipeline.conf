# =============================================================================
# Logstash Pipeline — Node 1
# Input:  Kafka topic hpc-logs (node-1-kafka, internal listener)
# Filter: mirrors single-node logic exactly
# Output: VictoriaLogs via Elasticsearch API on Node 2 (vlinsert)
# =============================================================================

input {
  kafka {
    bootstrap_servers => "node-1-kafka:9092"
    topics            => ["hpc-logs"]
    group_id          => "logstash-consumer"
    codec             => "json"
    auto_offset_reset => "earliest"
    consumer_threads  => 6
    max_poll_records  => "500"
    decorate_events   => false
  }
}

filter {

  # Rename Severity → level (rename removes the original field, copy does not)
  if [Severity] {
    mutate {
      rename => { "Severity" => "level" }
    }
  }
  mutate {
    uppercase => [ "level" ]
  }

  # Determine log_source from Attributes — mirrors single-node exactly
  if [Attributes][hpcmlog.filename] {
    mutate { add_field => { "log_source" => "hpcmlog" } }
  } else if [Attributes][monitoring_services.filename] {
    mutate { add_field => { "log_source" => "monitoring" } }
  } else {
    mutate { add_field => { "log_source" => "syslog" } }
  }

  # Tag events with pipeline stage (used by vmalert alert rules)
  mutate {
    add_field => { "ingest_stage" => "logstash" }
  }

  # Drop fields not needed in VictoriaLogs storage
  mutate {
    remove_field => [
      "@version","ingest_stage",
      "message", "event", "source",
      "source_file", "pipeline",
      "process_id"
    ]
  }
}

output {
  # VictoriaLogs Elasticsearch-compatible insert API on Node 2 (vlinsert).
  # The elasticsearch plugin handles batching natively — more efficient than
  # the http plugin which sends events one by one.
  elasticsearch {
    hosts            => ["http://node-2-vlinsert:9428/insert/elasticsearch/"]
    http_compression => true
    parameters       => {
      "_msg_field"     => "Body"
      "_time_field"    => "@timestamp"
      "_stream_fields" => "log_source"
    }
  }
}