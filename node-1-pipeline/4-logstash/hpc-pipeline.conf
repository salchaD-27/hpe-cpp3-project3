# =============================================================================
# Logstash Pipeline — Node 1
# Input:  Kafka topic hpc-logs (node-1-kafka, internal listener)
# Filter: mirrors single-node logic exactly
# Output: VictoriaLogs via Elasticsearch API on Node 2 (vlinsert)
# =============================================================================

input {
  kafka {
    bootstrap_servers => "node-1-kafka:9092"
    topics            => ["hpc-logs"]
    group_id          => "logstash-consumer"
    codec             => "json"
    auto_offset_reset => "earliest"
    consumer_threads  => 1
  }
}

filter {
  # Rename Severity → level
  if [Severity] {
    mutate {
      rename => { "Severity" => "level" }
    }
  }
  mutate {
    uppercase => [ "level" ]
  }

  # Extract message from Body or log field
  if [Body] {
    mutate {
      copy => { "Body" => "_msg" }
    }
  } else if [log] {
    mutate {
      copy => { "log" => "_msg" }
    }
  } else {
    mutate {
      add_field => { "_msg" => "unknown" }
    }
  }

  # Set service name
  if [service_name] {
    mutate {
      copy => { "service_name" => "service_name" }
    }
  } else if [service] {
    mutate {
      copy => { "service" => "service_name" }
    }
  } else {
    mutate {
      add_field => { "service_name" => "unknown" }
    }
  }

  # Set host name
  if [host_name] {
    mutate {
      copy => { "host_name" => "host_name" }
    }
  } else if [host] {
    mutate {
      copy => { "host" => "host_name" }
    }
  } else {
    mutate {
      add_field => { "host_name" => "unknown" }
    }
  }

  # Add ingest stage
  mutate {
    add_field => { "ingest_stage" => "logstash" }
  }

  # Remove unwanted fields
  mutate {
    remove_field => ["@version", "message", "event", "source", "log", "Body"]
  }
}

output {
  stdout { codec => rubydebug }
  
  # Use port 8001 (host port) instead of container port
  http {
    url => "http://host.docker.internal:8001/insert/jsonline"
    http_method => "post"
    format => "json"
    headers => { "Content-Type" => "application/json" }
    automatic_retries => 3
    retry_failed => true
    connect_timeout => 10
    request_timeout => 30
  }
}