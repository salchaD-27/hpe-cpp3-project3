apiVersion: 1

datasources:
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://node-9-vmauth:8427
    basicAuth: true
    basicAuthUser: read
    secureJsonData:
      basicAuthPassword: hpc-read-pass
    jsonData:
      maxLines: 1000
      timeInterval: "30s"
      queryTimeout: "30s"
    isDefault: true
    editable: true

  # Generic JSON datasource used to query Alertmanager's real REST API
  - name: Infinity-Alertmanager
    uid: infinity-alertmanager
    type: yesoreyeram-infinity-datasource
    access: proxy
    jsonData:
      datasource_mode: "advance"
      allowedHosts:
        - "http://node-1-alertmanager:9093"
    isDefault: false
    editable: true