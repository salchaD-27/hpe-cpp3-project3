input {
  kafka {
    bootstrap_servers => "node-1-kafka:9092"
    topics            => ["hpc-logs"]
    group_id          => "logstash-consumer"
    codec             => "json"
    auto_offset_reset => "earliest"
    consumer_threads  => 1
  }
}

filter {
  if [Severity] {
    mutate {
      rename => { "Severity" => "level" }
    }
  }
  mutate {
    uppercase => [ "level" ]
  }

  if [Body] {
    mutate {
      copy => { "Body" => "_msg" }
    }
  } else if [log] {
    mutate {
      copy => { "log" => "_msg" }
    }
  } else {
    mutate {
      add_field => { "_msg" => "unknown" }
    }
  }

  if [service_name] {
    mutate {
      copy => { "service_name" => "service_name" }
    }
  } else if [service] {
    mutate {
      copy => { "service" => "service_name" }
    }
  } else {
    mutate {
      add_field => { "service_name" => "unknown" }
    }
  }

  if [host_name] {
    mutate {
      copy => { "host_name" => "host_name" }
    }
  } else if [host] {
    mutate {
      copy => { "host" => "host_name" }
    }
  } else {
    mutate {
      add_field => { "host_name" => "unknown" }
    }
  }

  mutate {
    add_field => { "ingest_stage" => "logstash" }
  }

  mutate {
    remove_field => ["@version", "message", "event", "source", "log", "Body"]
  }
}

output {
  http {
    url             => "http://node-10-vlagent:9429/insert/jsonline"
    http_method     => "post"
    format          => "json"
    content_type    => "application/json"
    automatic_retries => 3
    retry_failed    => true
  }
}