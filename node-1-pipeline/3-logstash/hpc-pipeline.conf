input{
  kafka {
    bootstrap_servers => "node-1-kafka:9092"
    topics            => ["hpc-logs"]
    group_id          => "logstash-consumer"
    codec             => "json"
    auto_offset_reset => "earliest"
    consumer_threads  => 1
  }
}

filter {
 
  # Rename Severity → level 
  if [Severity] {
    mutate {
      rename => { "Severity" => "level" }
    }
  }
 
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }
 
  if [Body] {
    mutate {
      copy => { "Body" => "_msg" }
    }
  }

  if [source_file]=='/generated-logs/hpcmlog.jsonl' {
    mutate { add_field => { "log_source" => "hpcmlog" } }
  } else if [source_file]=='/generated-logs/monitoring_service.jsonl' {
    mutate { add_field => { "log_source" => "monitoring" } }
  } else if [source_file]=='/generated-logs/syslog.jsonl' {
    mutate { add_field => { "log_source" => "syslog" } }
  } else if [source_file]=='/generated-logs/sample_alerting_task3.jsonl' {
    mutate { add_field => { "log_source" => "sample_alerting_task3" } }
  } else if [source_file]=='/generated-logs/heartbeat.jsonl' {
    mutate { add_field => { "log_source" => "heartbeat" } }
  } else {
    mutate { add_field => { "log_source" => "dynamic_kv_ip_logs" } }
  }
 
  # Drop fields not needed in VictoriaLogs storage
  mutate {
    remove_field => [
      "@version","Body",
      "message", "event", "source",
      "source_file", "pipeline",
      "process_id"
    ]
  }
}

output {
  http {
    url             => "http://node-10-vlagent:9429/insert/jsonline"
    http_method     => "post"
    format          => "json"
    content_type    => "application/json"
    automatic_retries => 3
    retry_failed    => true
  }
}
