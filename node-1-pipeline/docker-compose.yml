services:
  log-generator:
    build: ./1-generator
    container_name: node-1-log-generator
    volumes:
      - ./1-generator/logs-generated:/logs-generated
    restart: unless-stopped
    networks:
      - multi-node-net

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.0.2
    container_name: node-1-fluent-bit
    volumes:
      - ./1-generator/logs-generated:/generated-logs:ro
      - ./2-fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./2-fluent-bit/parsers.conf:/fluent-bit/etc/parsers/parser.conf:ro
    ports:
      - "8081:2020"
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - multi-node-net

  kafka:
    image: apache/kafka:4.2.0
    container_name: node-1-kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://node-1-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@node-1-kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "node-1-kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - multi-node-net

  logstash:
    image: docker.elastic.co/logstash/logstash:9.3.2
    container_name: node-1-logstash
    volumes:
      - ./4-logstash/hpc-pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./4-logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./1-generator/logs-generated:/logs-generated:ro
    ports:
      - "9601:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - multi-node-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: node-1-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    volumes:
      - ./6-grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - multi-node-net

  vmalert:
    image: victoriametrics/vmalert:latest
    container_name: node-1-vmalert
    command:
      - "-datasource.url=http://node-5-vlselect:8004"
      - "-datasource.queryStep=30s"
      - "-rule=/etc/alerts/alerts.yml"
      - "-evaluationInterval=30s"
      - "-httpListenAddr=:8880"
      - "-notifier.url=http://alertmanager:9093"
    volumes:
      - ./7-vmalert/alerts.yml:/etc/alerts/alerts.yml:ro
      - ./7-vmalert/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "8881:8880"
    depends_on:
      - alertmanager
    restart: unless-stopped
    networks:
      - multi-node-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: node-1-alertmanager
    volumes:
      - ./7-vmalert/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.listen-address=:9093"
    ports:
      - "9095:9093"
    restart: unless-stopped
    networks:
      - multi-node-net

volumes:
  kafka-data:
  grafana-data:

networks:
  multi-node-net:
    external: true