# =============================================================================
# Node 1 — Pipeline Node
# Runs: Simulator, Fluent Bit, Kafka, Logstash, Grafana, VictoriaMetrics,
#        vmalert, Alertmanager, Kafka UI
#
# All services join multi-node-net so they can reach Node 2-5 by container name.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Log Simulator
  # ---------------------------------------------------------------------------
  logs-generator:
    image: python:3.12-slim
    container_name: node-1-generator
    volumes:
      - ./1-generator/generator.py:/scripts/generator.py:ro
      - ./1-generator/logs-original:/scripts/logs-original:ro
      - ./1-generator/generated-logs:/scripts/generated-logs
    command: python /scripts/generator.py
    restart: unless-stopped
    networks:
      - multi-node-net
    depends_on:
      - fluent-bit
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Fluent Bit
  # Tails JSONL files → Kafka topic hpc-logs
  # ---------------------------------------------------------------------------
  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.0.2
    container_name: node-1-fluent-bit
    ports:
      - "2020:2020"
    volumes:
      - ./2-fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./2-fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./1-generator/generated-logs:/generated-logs
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - multi-node-net
    deploy:
      resources:
        limits:
          memory: 256M

  kafka:
    image: apache/kafka:4.2.0
    container_name: node-1-kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://node-1-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@node-1-kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "node-1-kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - multi-node-net

  logstash:
    image: docker.elastic.co/logstash/logstash:9.3.2
    container_name: node-1-logstash
    volumes:
      - ./3-logstash/hpc-pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./3-logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./1-generator/generated-logs:/generated-logs:ro
    ports:
      - "9601:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - multi-node-net

  grafana:
    image: grafana/grafana:11.6.15
    container_name: node-1-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource,yesoreyeram-infinity-datasource
    volumes:
      - ./4-grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - multi-node-net

  vmalert:
    image: victoriametrics/vmalert:latest
    container_name: node-1-vmalert
    command:
      - "-datasource.url=http://node-9-vmauth:8427"
      - "-datasource.queryStep=30s"
      - "-rule=/etc/alerts/*.yml"
      - "-rule=/etc/alerts/cross-alerting/*.yml"
      - "-evaluationInterval=30s"
      - "-httpListenAddr=:8880"
      - "-notifier.url=http://node-1-alertmanager:9093"
      - "-datasource.basicAuth.username=read"
      - "-datasource.basicAuth.password=hpc-read-pass"
    volumes:
      - ./5-vmalert/alerting/vmalert:/etc/alerts:ro
      - ./5-vmalert/alerting/vmalert/cross-alerting:/etc/alerts/cross-alerting:ro
    ports:
      - "8881:8880"
    depends_on:
      - alertmanager
    restart: unless-stopped
    networks:
      - multi-node-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: node-1-alertmanager
    volumes:
      - ./5-vmalert/alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.listen-address=:9093"
    ports:
      - "9095:9093"
    restart: unless-stopped
    networks:
      - multi-node-net

volumes:
  kafka-data:
  grafana-data:

networks:
  multi-node-net:
    external: true