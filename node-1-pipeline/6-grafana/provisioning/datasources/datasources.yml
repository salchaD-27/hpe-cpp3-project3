apiVersion: 1

datasources:
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://node-9-vmauth:8427/read
    basicAuth: true
    basicAuthUser: read
    secureJsonData:
      basicAuthPassword: hpc-read-pass
    jsonData:
      logsType: json
      timeField: _time
      maxLines: 1000
      timeInterval: "30s"
      queryTimeout: "30s"
      # Disable stats endpoint that causes errors
      disableStats: true
      disableVolume: true
    isDefault: true
    editable: true

  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://node-1-victoriametrics:8428
    isDefault: false
    editable: true

  - name: Alertmanager
    uid: alertmanager-native
    type: prometheus
    access: proxy
    url: http://node-1-alertmanager:9093
    isDefault: false
    editable: true