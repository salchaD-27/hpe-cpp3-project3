services:
  vlstorage:
    image: victoriametrics/victoria-logs:v1.49.0
    container_name: node-7-vlstorage-3
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=365d"
      - "-httpListenAddr=:9428"
    volumes:
      - ./storage:/storage
    ports:
      - "8004:9428"
    restart: unless-stopped
    networks:
      - multi-node-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  multi-node-net:
    external: true