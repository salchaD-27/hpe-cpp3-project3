services:
  log-generator:
    build: ./1-log-gen
    container_name: node-1-log-generator
    volumes:
      - ./1-log-gen/logs-generated:/logs-generated
    restart: unless-stopped

  fluentbit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.0.2
    container_name: node-1-fluentbit
    volumes:
      - ./1-log-gen/logs-generated:/logs/generated:ro
      - ./2-fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./2-fluent-bit/parsers.conf:/fluent-bit/etc/parsers/parser.conf:ro
    ports:
      - "8081:2020"
    depends_on:
      - kafka
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.0
    container_name: node-1-kafka
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:9.3.2
    container_name: node-1-logstash
    volumes:
      - ./4-logstash/hpc-pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./4-logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "9601:9600"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  vlinsert:
    image: victoriametrics/victoria-logs:v1.49.0
    container_name: node-1-vlinsert
    command:
      - "-storageNode=host.docker.internal:8002"
      - "-storageNode=host.docker.internal:8003"
      - "-httpListenAddr=:9428"
    ports:
      - "8001:9428"
    depends_on:
      - logstash
    restart: unless-stopped

volumes:
  kafka-data:
