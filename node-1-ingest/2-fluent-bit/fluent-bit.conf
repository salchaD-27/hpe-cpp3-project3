[SERVICE]
    Flush           1
    Log_Level       info
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020

[INPUT]
    Name             tail
    Path             /logs/generated/*.jsonl
    Path_Key         source_file
    Tag              hpc.logs
    Refresh_Interval 1
    Mem_Buf_Limit    100MB
    Read_from_Head   On

[OUTPUT]
    Name            kafka
    Match           *
    Brokers         node-1-kafka:9092
    Topics          hpc-logs
    Format          json
    Timestamp_Key   @timestamp
    rdkafka.request.required.acks        1
    rdkafka.compression.codec            lz4