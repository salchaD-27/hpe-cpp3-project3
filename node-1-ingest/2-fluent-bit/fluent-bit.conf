[SERVICE]
    Flush           1
    Log_Level       info
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020

[INPUT]
    Name             tail
    Path             /logs/generated/*.jsonl
    Path_Key         source_file
    Tag              app.logs
    Refresh_Interval 1
    Mem_Buf_Limit    100MB
    Read_from_Head   On

[FILTER]
    Name    modify
    Match   app.logs
    Add     _time ${@timestamp}
    Add     _msg ${Body}
    Add     level ${Severity}
    Add     host_name ${Resource[host.name]}
    Add     service_name ${Resource[service.name]}

[OUTPUT]
    Name            kafka
    Match           *
    Brokers         node-1-kafka:9092
    Topics          hpc-logs
    Format          json
    Timestamp_Key   @timestamp
