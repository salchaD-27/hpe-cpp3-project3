input {
  kafka {
    bootstrap_servers => "node-1-kafka:9092"
    topics            => ["hpc-logs"]
    group_id          => "logstash-consumer"
    codec             => "json"
    auto_offset_reset => "earliest"
    consumer_threads  => 1
  }
}

filter {
  mutate {
    rename => { "Body" => "_msg" }
    rename => { "Severity" => "level" }
    rename => { "[Resource][host.name]" => "host_name" }
    rename => { "[Resource][service.name]" => "service_name" }
  }

  if ![level] { mutate { replace => { "level" => "INFO" } } }
  mutate { uppercase => [ "level" ] }

  if [source_file] =~ /hpcmlog/ {
    mutate { add_field => { "vl_stream" => "hpcmlog" } }
  } else if [source_file] =~ /monitoring/ {
    mutate { add_field => { "vl_stream" => "monitoring" } }
  } else if [source_file] =~ /syslog/ {
    mutate { add_field => { "vl_stream" => "syslog" } }
  }

  # Set defaults for missing fields
  if ![host_name] { mutate { replace => { "host_name" => "unknown" } } }
  if ![service_name] { mutate { replace => { "service_name" => "unknown" } } }

  # Create _stream as a JSON OBJECT (not a string)
  mutate {
    add_field => { 
      "[_stream][host_name]" => "%{host_name}"
      "[_stream][level]" => "%{level}"
      "[_stream][vl_stream]" => "%{vl_stream}"
    }
  }

  mutate {
    add_field => { "_time" => "%{@timestamp}" }
    add_field => { "ingest_stage" => "logstash" }
  }

  mutate {
    remove_field => ["@version", "host", "message", "event", "Severity", "Resource", "Attributes", "source_file"]
  }
}

output {
  http {
    url => "http://host.docker.internal:8001/insert/jsonline"
    http_method => "post"
    format => "json"
    headers => { "Content-Type" => "application/json" }
    automatic_retries => 3
    retry_failed => true
  }
}