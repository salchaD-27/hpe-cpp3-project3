input {
  kafka {
    bootstrap_servers => "node-1-kafka:9092"
    topics            => ["hpc-logs"]
    group_id          => "logstash-consumer"
    codec             => "json"
    auto_offset_reset => "earliest"
    consumer_threads  => 1
  }
}

filter {
  # Parse the nested log field
  json {
    source => "log"
    target => "parsed"
  }

  # Extract fields from parsed
  mutate {
    copy => { "[parsed][Body]" => "_msg" }
    copy => { "[parsed][Severity]" => "level" }
    copy => { "[parsed][Resource][host.name]" => "host_name" }
    copy => { "[parsed][Resource][service.name]" => "service_name" }
  }

  # Ensure defaults
  if ![_msg] { mutate { add_field => { "_msg" => "unknown" } } }
  if ![level] { mutate { add_field => { "level" => "INFO" } } }
  mutate { uppercase => [ "level" ] }
  
  if ![host_name] { mutate { add_field => { "host_name" => "unknown" } } }
  if ![service_name] { mutate { add_field => { "service_name" => "unknown" } } }

  # Set stream
  if [source_file] {
    if [source_file] =~ /hpcmlog/ { mutate { add_field => { "vl_stream" => "hpcmlog" } } }
    else if [source_file] =~ /monitoring/ { mutate { add_field => { "vl_stream" => "monitoring" } } }
    else if [source_file] =~ /syslog/ { mutate { add_field => { "vl_stream" => "syslog" } } }
    else { mutate { add_field => { "vl_stream" => "default" } } }
  } else {
    mutate { add_field => { "vl_stream" => "default" } }
  }

  # Create _stream object
  mutate {
    add_field => { 
      "[_stream][host_name]" => "%{host_name}"
      "[_stream][level]" => "%{level}"
      "[_stream][vl_stream]" => "%{vl_stream}"
    }
  }

  # Add time
  mutate {
    add_field => { "_time" => "%{@timestamp}" }
    add_field => { "ingest_stage" => "logstash" }
  }

  # Clean up
  mutate {
    remove_field => ["parsed", "log", "@timestamp", "@version", "source_file"]
  }
}

output {
  http {
    url => "http://host.docker.internal:8001/insert/jsonline"
    http_method => "post"
    format => "json"
    headers => { "Content-Type" => "application/json" }
    automatic_retries => 3
    retry_failed => true
  }
}
