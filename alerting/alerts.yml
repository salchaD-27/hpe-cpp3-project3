      # Task 1 : multi-condition alerting from one query
      - alert: MultiConditionSyslogAlert
        expr: '*
              | copy "Resource.service.name" as service
              | copy "Resource.host.name" as host
              | copy "Attributes.priority" as priority_raw
              | math priority_raw + 0 as priority
              | format "<host> : <service> : <_msg>" as formatted
              | stats by (formatted)
                  count() if (host:="padma" OR service:in("systemd", "glusterd") OR priority:range[70, Inf]) as CRITICAL,
                  count() if (priority:range[30, 70) AND host:!="padma" AND service:!in("systemd", "glusterd")) as WARN,
                  count() if (priority:range[0, 30) AND host:!="padma" AND service:!in("systemd", "glusterd")) as SAFE'
        for: 10s
        labels:
          severity: "{{ if gt $value 0 }}dynamic{{ else }}none{{ end }}"
        annotations:
          summary: "Multi-condition syslog alert triggered"
          description: "{{ $labels.formatted }}"

      # Task 3 : message-level alert separation
      - alert: SampleMessageDetected
        expr: '*
          | copy "Resource.service.name" as service
          | copy "Resource.host.name" as host
          | copy _msg as message
          | format "<host> | <service> | <message>" as formatted
          | stats by (formatted) count() as cnt
          | filter cnt:>0'
        for: 5s
        labels:
          severity: info
          source: syslog
        annotations:
          summary: "Syslog message detected"
          description: "{{ $labels.formatted }}"
          details: "A log entry was observed for service {{ $labels.formatted }}"