global:
  resolve_timeout: 5m

# Route configuration - where alerts go
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'null'

# Inhibition rules - suppress alerts when certain conditions exist
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

# Receivers - none configured (web UI only)
receivers:
  - name: 'null'